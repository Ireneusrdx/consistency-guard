# Consistency Guard — Render blueprint (FREE tier, $0/month).
# Usage: push this repo to GitHub, then in Render: New → Blueprint → select the repo.
#
# Free-tier notes:
# - The web service sleeps after ~15 min without traffic and wakes on the next
#   visit (takes ~30-60s). Fine for a demo/portfolio app.
# - The database is NOT on Render (Render's free Postgres expires). Use a free
#   Neon Postgres instead: https://neon.tech — create a project, copy its
#   connection string, and paste it as DATABASE_URL when Render prompts you
#   during Blueprint creation.
#
# After the first deploy, set CORS_ORIGINS to your actual
# https://<service>.onrender.com URL.

services:
  - type: web
    name: consistency-guard
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false # Render prompts for this at Blueprint time → paste your Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://consistency-guard.onrender.com # replace with your real URL after first deploy
